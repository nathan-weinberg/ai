name: Bump Pins

# ------------------------------------------------------------------------------
# Weekly pinned-client and vLLM bump
#
# Runs `cargo xtask bump-pins`, which moves the pinned coding clients (Claude
# Code, OpenCode 1.x/2.x, pi, Codex) and the vLLM GPU image to their latest
# upstream releases, rewrites every site from the manifests, swaps the checksum
# fixtures, and validates the result with `check-pins` (see
# xtask/src/pins/bump.rs).
#
# The result is a DRAFT pull request from the `bot/bump-pins` branch whose body
# is the re-validation checklist. It never auto-merges: behavioral pins (tool
# lists, exit codes, xfails, replay recordings, "verified against" claims) are
# re-validated by a person, and the GPU acceptance lanes (`vllm-full-suite`
# label) are the ready-for-review gate.
#
# The PR is opened with the praxis-bot-app token rather than github.token, so
# CI runs on it.
# ------------------------------------------------------------------------------

on:
  schedule:
    # Mondays, clear of the nightly, CodeQL, publish, and GPU schedules.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      pins:
        description: "Space-separated pins to bump (claude opencode opencode-v2 pi codex vllm); empty for all"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  BRANCH: bot/bump-pins

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: bump-pins-cargo

      - name: Bump pins
        env:
          # Lifts the anonymous GitHub API rate limit for release discovery.
          GITHUB_TOKEN: ${{ github.token }}
          PINS: ${{ inputs.pins }}
        run: |
          args=()
          for pin in $PINS; do
            args+=(--pin "$pin")
          done
          cargo xtask bump-pins "${args[@]}" --report "$RUNNER_TEMP/bump-report.md"

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pin moved; nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate token
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PRAXIS_BOT_APP_ID }}
          private-key: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}

      - name: Open or update the draft pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          # A person re-validating on the bot branch pushes their own commits;
          # force-pushing a fresh bump would discard them. Leave that PR alone.
          if [ -n "$pr" ]; then
            others=$(gh pr view "$pr" --json commits \
              --jq "[.commits[].authors[].login | select(. != \"$bot\")] | length")
            if [ "$others" -gt 0 ]; then
              echo "::notice::#$pr has commits from people; not overwriting it."
              exit 0
            fi
          fi

          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit --signoff --quiet -m "chore(pins): bump pinned clients and vLLM image" \
            -m "Generated by cargo xtask bump-pins; see the pull request for the re-validation checklist."
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$BRANCH"

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/bump-report.md"
          else
            gh pr create --draft --base main --head "$BRANCH" \
              --title "chore(pins): bump pinned clients and vLLM image" \
              --body-file "$RUNNER_TEMP/bump-report.md"
          fi
